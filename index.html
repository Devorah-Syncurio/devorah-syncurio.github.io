<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Title</title>
  <!-- Include Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Other HTML content -->

  <h2>Payment Method Breakdown</h2>
  <canvas id="currentMonthChart"></canvas>
  <canvas id="nextMonthChart"></canvas>

  <script>
    // Data migration function
    function migrateData() {
      const elements = document.querySelectorAll('.invoice-status');
      elements.forEach(element => {
        if (element.textContent.includes("Upon Invoice")) {
          element.textContent = element.textContent.replace("Upon Invoice", "On Demand");
        }
      });
    }

    // Charts configuration
    const currentMonthCtx = document.getElementById('currentMonthChart').getContext('2d');
    const nextMonthCtx = document.getElementById('nextMonthChart').getContext('2d');

    const currentMonthChart = new Chart(currentMonthCtx, {
      type: 'pie',
      data: {
        labels: ['Credit Card', 'PayPal', 'Bank Transfer'],
        datasets: [{
          label: 'Current Month Invoices',
          data: [30, 50, 20],
          backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56']
        }]
      }
    });

    const nextMonthChart = new Chart(nextMonthCtx, {
      type: 'pie',
      data: {
        labels: ['Credit Card', 'PayPal', 'Bank Transfer'],
        datasets: [{
          label: 'Next Month Forecast',
          data: [40, 40, 20],
          backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56']
        }]
      }
    });

    // Call data migration on page load
    window.onload = migrateData;
  </script>
</body>
</html>
